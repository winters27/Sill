[package]
name = "sill"
version = "0.1.0"
description = "Sill: a Raycast-compatible launcher for Windows"
authors = ["Brandon Winters"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
# preserve_order, so reformatting JSON does not reorder somebody's keys.
# Without it a Value is backed by a BTreeMap and every round trip sorts each
# object alphabetically, which is a destructive surprise from an action that
# promised only to change the whitespace.
serde_json = { version = "1", features = ["preserve_order"] }
# `net` for the loopback socket the MCP bridge connects back over.
tokio = { version = "1.53.1", features = ["process", "io-util", "net", "sync", "macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
tauri-plugin-global-shortcut = "2.3.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_DataExchange", "Win32_System_SystemInformation", "Win32_System_Registry", "Win32_System_Shutdown", "Win32_System_Power", "Win32_System_WinRT", "Media_Ocr", "Graphics_Imaging", "Foundation", "Win32_Storage_Xps", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Com_StructuredStorage", "Devices_Radios", "Win32_Media_Speech", "Win32_System_Diagnostics_ToolHelp", "Win32_System_RemoteDesktop", "Media_Control", "Security_Credentials_UI", "Win32_UI_Accessibility", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_TaskScheduler", "Win32_UI_Shell_Common"] }
# Named directly only because the `interface` macro, which is what declares
# the audio interface Windows does not document, expands to absolute
# `::windows_core::` paths. Pinned to the same version `windows` itself uses,
# or the two would be different types with the same names.
windows-core = "0.62.2"
# The WinRT async type `UserConsentVerifier` hands back. `windows` returns it
# but does not re-export it, so naming the operation Windows Hello's interop
# call produces means naming the crate it comes from. Pinned to the version
# `windows` itself depends on, for the same reason windows-core is.
windows-future = "0.3.2"
# Reaching the webview's own suspend, which Tauri does not wrap. Pinned to the
# version Tauri itself depends on, so the controller it hands back and the
# interface we cast it to are the same type.
webview2-com = "0.38.2"
# The `Interface` trait that performs that cast has to come from the
# windows-core those interfaces were generated against, which is a version
# behind the one the rest of this crate uses. Two versions of one crate is the
# price of reaching past the wrapper; renamed so which is which stays obvious.
webview2-core = { package = "windows-core", version = "0.61.2" }
window-vibrancy = "0.8.0"
tauri-plugin-clipboard-manager = "2.3.2"
png = "0.18.1"
base64 = "0.23.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
# Two Sills means two keyboard hooks, two clipboard watchers and a
# fight over the summon shortcut, which reads as the launcher being
# broken rather than as there being two of it.
tauri-plugin-single-instance = "2"
cpal = "0.18"
rubato = "5"
audioadapter-buffers = "5"
sha2 = "0.10"
# SHA-1 and UUIDs, for the utility answers. Both were already being built as
# transitive dependencies, so naming them here costs nothing new.
sha1 = "0.11"
uuid = { version = "1", features = ["v4"] }
tempfile = "3"
zip = "8.6.0"
# `gzip`, for the extension store. Its index is 19 MB of JSON uncompressed and
# 3.5 MB with it, measured, which is the difference between an acceptable
# on-demand fetch and one nobody would wait for.
reqwest = { version = "0.13.4", features = ["multipart", "stream", "json", "gzip"] }
fend-core = "1.5.8"
clipboard-master = "4.0.0"
arboard = "3.6.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
arc-swap = "1.9.2"
async-trait = "0.1.92"
emojis = "0.9.0"
ignore = "0.4.33"
notify = "8.2.0"
tauri-plugin-updater = "2.11.0"

