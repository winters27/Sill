[package]
name = "sill"
version = "0.1.0"
description = "Sill: a Raycast-compatible launcher for Windows"
authors = ["Brandon Winters"]
edition = "2021"
license = "MIT"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "sill_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["process", "io-util", "sync", "macros", "rt-multi-thread", "time"] }
tokio-util = { version = "0.7.19", features = ["codec"] }
futures-util = { version = "0.3.34", default-features = false, features = ["std", "sink"] }
tauri-plugin-global-shortcut = "2.3.2"
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Dwm", "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_ProcessStatus", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_DataExchange", "Win32_System_SystemInformation"] }
window-vibrancy = "0.8.0"
tauri-plugin-clipboard-manager = "2.3.2"
png = "0.18.1"
base64 = "0.23.1"
tauri-plugin-autostart = "2.5.1"
tauri-plugin-dialog = "2.7.2"
# Two Sills means two keyboard hooks, two clipboard watchers and a
# fight over the summon shortcut, which reads as the launcher being
# broken rather than as there being two of it.
tauri-plugin-single-instance = "2"
cpal = "0.18"
rubato = "5"
audioadapter-buffers = "5"
sha2 = "0.10"
tempfile = "3"
zip = "8.6.0"
reqwest = { version = "0.13.4", features = ["multipart", "stream", "json"] }
fend-core = "1.5.8"
clipboard-master = "4.0.0"
arboard = "3.6.1"
rusqlite = { version = "0.40.2", features = ["bundled"] }
arc-swap = "1.9.2"
async-trait = "0.1.92"

