# The same `npm run verify` a person runs before committing, run again where
# forgetting is not an option. Windows because Sill is a Windows program and
# most of what the suite checks is Win32.
name: verify

# Not on every push. This is a private repo on a Windows runner, which bills at
# twice the Linux rate, and a run is about 16 minutes. Eighty-seven pushes over
# four days came to roughly 2,384 billed minutes against a 2,000-minute monthly
# allowance, and green runs would have cost exactly the same as the red ones.
#
# What this catches that a developer's machine cannot is whether Sill builds on
# a computer that has never seen it: a dependency missing from the lockfile, a
# file nobody committed, a step that only works because of something already
# installed. Those are release questions. They do not change between two pushes
# on the same afternoon, and `npm run verify` locally is the identical command.
#
# So: on a tag, which is when the answer is worth paying for, and on the button,
# which is when somebody wants it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# A second push while the first is still running makes the first answer a
# question nobody is asking any more, and these are paid minutes.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            host/package-lock.json

      # cache-on-failure, or a run that fails saves nothing and the next one
      # compiles the whole dependency tree again. Every run here was 15 to 18
      # minutes and every one of them logged "No cache found", because the
      # early ones failed and a failed job does not write the cache by default.
      # A gate is most useful while something is broken, which is exactly when
      # the default leaves it slowest.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci
      - run: npm --prefix host ci

      # Before cargo, never after: tauri.conf.json points frontendDist at
      # ../build, and a Rust build with nothing there fails on the missing
      # directory rather than on anything about the code.
      - run: npm run build

      # gate:views draws ten real Raycast extensions rather than fixtures,
      # and they live in a tree that is gitignored here: it is somebody else's
      # repository and far too big to vendor for ten directories. So it is
      # fetched, and only those ten: a sparse blobless clone is small and
      # four seconds against many gigabytes for the whole thing.
      #
      # Through the same script a person runs on a fresh clone, rather than
      # through a copy of it written out here. The copy was the problem: which
      # extensions the gate needs is stated in the gate itself, and two lists
      # with nothing making them agree is how a gate quietly starts skipping
      # the thing it was written to check. `scripts/fetch-raycast-src.mjs`
      # reads the gate, and carries the reasoning that used to live in this
      # comment: why the clone is deliberately unpinned, why the dependencies
      # are not optional, and why the install ignores scripts.
      - name: Fetch the real extensions gate:views builds against
        run: npm run extensions:fetch

      # Two Rust tests rank and read `extensions/build/index.json`, and neither
      # had ever run here. That directory is gitignored, and the only thing
      # that writes it is `gate:views`, which `npm run verify` runs *after*
      # `verify:rust`. So the file was never there, both tests took their skip,
      # and one of them reported a working ranker while `search` returned
      # nothing at all. Building three commands here costs about a second and
      # is the difference between those tests existing and not.
      #
      # `gate:views` still builds them again. It builds five commands to two
      # here, and rebuilding is what makes it a gate on the current tree rather
      # than on whatever this step happened to leave behind.
      - name: Build the index the Rust suite ranks
        shell: bash
        run: |
          node scripts/build-extension.mjs \
            extensions/raycast-src/extensions/uuid-generator viewHistory
          node scripts/build-extension.mjs \
            extensions/raycast-src/extensions/password-generator \
            generate-random-password

      # bash because gate:views is a shell script; it is git-bash on this image.
      #
      # SILL_BUILT_INDEX, so the two tests above fail rather than skip if the
      # step before this one ever stops producing an index. A skip nobody sees
      # is how they came to prove nothing in the first place.
      - run: npm run verify
        shell: bash
        env:
          SILL_BUILT_INDEX: required

      # Which performance budgets live here, and which deliberately do not.
      #
      # This agent is a borrowed virtual machine with no display, no graphics
      # hardware and neighbours competing for its cores. It cannot honestly say
      # what a frame costs, so nothing in milliseconds of a running launcher is
      # gated here and nothing should be added. Those live in
      # `scripts/nightly.ps1`, on a machine set aside for it, and are not
      # required checks on purpose: a merge gate that depends on what else the
      # machine was doing is a gate everybody learns to ignore.
      #
      # What an agent holds as well as any machine is a count, a ratio or a
      # structural fact, and three of those already ran in the step above:
      # the ranking budgets in `tests/budgets.rs`, and the rule in
      # `verify:source` that a repeating timer in the window must go through
      # `pollWhileVisible` or say why being hidden stops it. That last one is
      # the network-at-rest budget, in the only shape a build agent can check
      # it: the count has to be zero, and the widget that made it six an hour
      # was a bare `setInterval` in a component that hiding a window does not
      # destroy. See `docs/budgets.md` for where each row runs.

      # The ranking cost, in the log of every run rather than only the runs
      # that break. The budget on an agent is loose on purpose, so the number
      # underneath it is the thing worth watching: a build that starts
      # answering a keystroke in twice what it did is worth seeing before it
      # crosses anything. Already compiled by the step above, so it costs a
      # second.
      - name: Ranking cost, recorded every run
        run: cargo test --manifest-path src-tauri/Cargo.toml --test budgets ranking -- --nocapture
