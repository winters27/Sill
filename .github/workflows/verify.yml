# The same `npm run verify` a person runs before committing, run again where
# forgetting is not an option. Windows because Sill is a Windows program and
# most of what the suite checks is Win32.
name: verify

on: [push, pull_request, workflow_dispatch]

# A second push while the first is still running makes the first answer a
# question nobody is asking any more, and these are paid minutes.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            host/package-lock.json

      # cache-on-failure, or a run that fails saves nothing and the next one
      # compiles the whole dependency tree again. Every run here was 15 to 18
      # minutes and every one of them logged "No cache found", because the
      # early ones failed and a failed job does not write the cache by default.
      # A gate is most useful while something is broken, which is exactly when
      # the default leaves it slowest.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - run: npm ci
      - run: npm --prefix host ci

      # Before cargo, never after: tauri.conf.json points frontendDist at
      # ../build, and a Rust build with nothing there fails on the missing
      # directory rather than on anything about the code.
      - run: npm run build

      # gate:views draws three real Raycast extensions rather than fixtures,
      # and they live in a tree that is gitignored here: it is somebody else's
      # repository and far too big to vendor for three directories. So it is
      # fetched, and only those three: a sparse blobless clone is 25 MB and
      # four seconds against many gigabytes for the whole thing.
      #
      # Deliberately not pinned to a commit. The gate exists to answer whether
      # the host still renders real extensions, and a frozen copy stops being
      # able to answer that. The cost is that an upstream change can turn this
      # red; pinning is one line here if it ever does.
      #
      # Their dependencies are installed, and that is not optional. The gate
      # bundles five commands and one of them, uuid-generator's generateV7,
      # imports uuid, typeid-js and ulidx. esbuild bundles what it is pointed
      # at, so an unresolved import is a build failure rather than a warning.
      # viewHistory builds without them, which is what made it look as though
      # none of them were needed.
      #
      # `--ignore-scripts` because `@raycast/api` runs `bin/ray npm-post-install`
      # after install, which is a shell line that does not survive cmd.exe.
      # Nothing here needs whatever it does: these are bundled with esbuild and
      # run against Sill's own API, never against Raycast's toolchain.
      - name: Fetch the real extensions gate:views builds against
        shell: bash
        run: |
          git clone --filter=blob:none --sparse --depth 1 \
            https://github.com/raycast/extensions.git extensions/raycast-src
          git -C extensions/raycast-src sparse-checkout set \
            extensions/uuid-generator extensions/password-generator extensions/emoji
          for extension in uuid-generator password-generator emoji; do
            npm --prefix "extensions/raycast-src/extensions/$extension" ci \
              --ignore-scripts
          done

      # bash because gate:views is a shell script; it is git-bash on this image.
      - run: npm run verify
        shell: bash

      # The ranking cost, in the log of every run rather than only the runs
      # that break. The budget on an agent is loose on purpose, so the number
      # underneath it is the thing worth watching: a build that starts
      # answering a keystroke in twice what it did is worth seeing before it
      # crosses anything. Already compiled by the step above, so it costs a
      # second.
      - name: Ranking cost, recorded every run
        run: cargo test --manifest-path src-tauri/Cargo.toml --test budgets ranking -- --nocapture
