# Whether `gh release create --draft` works from a workflow.
#
# Temporary, and narrower than the last one: that established the POST returns
# 201, this establishes it for the exact command the release workflow now runs,
# with the same flags and the same token.
name: token-probe

on: workflow_dispatch

permissions:
  contents: write

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: gh release create, as the release workflow calls it
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="token-probe-$GITHUB_RUN_ID"
          printf 'A probe. Deleted moments after it was made.\n' > notes.md

          if gh release view "$tag" > /dev/null 2>&1; then
            echo "RESULT: it already existed, which should not happen"
            exit 1
          fi

          gh release create "$tag" --draft --title "token probe" --notes-file notes.md
          echo "RESULT: gh release create --draft works from a workflow"

          gh release view "$tag" --json isDraft,tagName --jq '"read back: \(.tagName) draft \(.isDraft)"'
          gh release delete "$tag" --yes --cleanup-tag
          echo "RESULT: and it was removed"
